version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights
      - ./data.db:/app/data.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # GPU reservation disabled — remove comments below to re-enable once NVIDIA WSL2
    # passthrough is confirmed working (requires Windows NVIDIA driver >= 527.41 and
    # Docker Desktop WSL2 backend with NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
